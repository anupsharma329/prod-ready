# NodePort is the simplest way to reach a service from outside the
# cluster without setting up an Ingress controller first. It's a
# reasonable Phase-2 stepping stone, NOT the final production access
# pattern - in Phase 3+ we'll likely add an nginx Ingress in front of
# this once you confirm your ingress controller setup.
#
# Access pattern once applied: http://<any-node-ip>:30080
apiVersion: v1
kind: Service
metadata:
  name: inventory-api-nodeport
  namespace: inventory-api
spec:
  selector:
    app: inventory-api
  type: NodePort
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080  # must be in range 30000-32767