# WARNING: This is a plain K8s Secret - base64-encoded, NOT encrypted.
# Fine for local learning/testing. Do NOT commit real credentials in this
# form to Git - we'll replace this mechanism with Sealed Secrets in
# Phase 7 (hardening) so secrets are safe to store in a GitOps repo.
#
# For now, apply this directly with kubectl (never commit filled-in
# values), or use `kubectl create secret` imperatively instead of this file:
#
#   kubectl create secret generic db-credentials \
#     --namespace=inventory-api \
#     --from-literal=POSTGRES_USER=appuser \
#     --from-literal=POSTGRES_PASSWORD='changeme-use-a-real-password' \
#     --from-literal=POSTGRES_DB=appdb
#
# The YAML below is shown for reference/completeness only.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: inventory-api
type: Opaque
stringData:  # stringData lets you write plaintext here; K8s base64-encodes it for you
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: Tekn#2025
  POSTGRES_DB: appdb