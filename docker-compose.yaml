# LOCAL DEV ONLY - this file is never used in the K8s/production path.
# It exists purely so you can iterate on app code without a cluster.
services:
  api:
    build:
      context: ./app
    image: inventory-api:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://appuser:apppass@db:5432/appdb
      LOG_LEVEL: DEBUG
    depends_on:
      db:
        condition: service_healthy
    # Mount source for live-reload style dev (optional, comment out if
    # you'd rather test the exact built image each time)
    # volumes:
    #   - ./app:/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: